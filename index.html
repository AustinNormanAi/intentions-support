<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070816">
<title>Intentions</title>
<meta name="description" content="Intentions for iPhone: turn a goal you care about into one small step a day.">
<style>
  :root {
    --night: #070816; --ink: #ffffff; --ink-2: rgba(230, 234, 255, .72); --ink-3: rgba(230, 234, 255, .5);
    --indigo: #4c3dff; --teal: #0fb5a6; --violet: #9b3dff; --peri: #8a7dff;
    --glass: rgba(255, 255, 255, .06); --glass-edge: rgba(255, 255, 255, .12);
  }
  * { box-sizing: border-box; }
  html { background: var(--night); }
  body {
    margin: 0; min-height: 100vh; color: var(--ink-2); background: var(--night);
    background-image:
      radial-gradient(60rem 36rem at 10% -10%, rgba(76, 61, 255, .38), transparent 60%),
      radial-gradient(48rem 30rem at 110% 10%, rgba(15, 181, 166, .26), transparent 60%),
      radial-gradient(50rem 34rem at 50% 110%, rgba(155, 61, 255, .24), transparent 60%);
    background-attachment: fixed;
    font: 17px/1.6 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 40rem; margin: 0 auto; padding: max(3.5rem, env(safe-area-inset-top)) 16px 4rem; }
  .mark { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 1.25rem;
    background: radial-gradient(circle at 30% 30%, var(--teal), transparent 60%), radial-gradient(circle at 70% 70%, var(--violet), transparent 60%), var(--indigo); }
  h1 { color: var(--ink); font-size: 2.2rem; line-height: 1.1; margin: 0 0 .5rem; }
  .lead { font-size: 1.15rem; margin: 0 0 2rem; }
  a.row { display: block; text-decoration: none; color: var(--ink); background: var(--glass); border: 1px solid var(--glass-edge);
    border-radius: 22px; padding: 1rem 1.25rem; margin: .7rem 0; -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  a.row span { display: block; color: var(--ink-2); font-size: .95rem; margin-top: .15rem; }
  a.row b::after { content: " \203A"; color: var(--peri); }
  footer { margin-top: 3rem; color: var(--ink-3); font-size: .9rem; }
  footer a { color: var(--peri); }
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true"></div>
<h1>Intentions</h1>
<p class="lead">Turn a goal you care about into one small step a day. For iPhone.</p>

<a class="row" href="support.html"><b>Support</b><span>How it works, common questions, and how to reach us</span></a>
<a class="row" href="privacy.html"><b>Privacy Policy</b><span>What stays on your phone, and what the AI sees</span></a>

<footer>Made by Austin Norman &middot; <a href="mailto:austinnormanads@gmail.com">austinnormanads@gmail.com</a></footer>
</main>
</body>
</html>
